<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Đăng nhập — EduQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;
  }
  .card{
    width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:2rem 1.8rem;
  }
  .logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.4rem;text-align:center;margin-bottom:.2rem}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.4rem;font-weight:600}
  .tabs{display:flex;background:var(--card2);border-radius:999px;padding:.25rem;margin-bottom:1.3rem}
  .tab{flex:1;text-align:center;padding:.5rem;border-radius:999px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--muted)}
  .tab.active{background:var(--purple);color:#fff}
  label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin:.7rem 0 .3rem}
  input[type=text],input[type=email],input[type=password]{
    width:100%;padding:.65rem .85rem;border-radius:10px;border:1.5px solid var(--border);
    background:var(--card2);color:var(--text);font-family:inherit;font-size:.9rem;
  }
  .role-choice{display:flex;gap:.6rem;margin-top:.4rem}
  .role-opt{
    flex:1;border:1.5px solid var(--border);border-radius:10px;padding:.6rem;text-align:center;
    cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);
  }
  .role-opt.active{border-color:var(--purple);background:var(--purple-lt);color:var(--purple)}
  .btn-submit{
    margin-top:1.3rem;width:100%;padding:.75rem;border:none;border-radius:999px;
    background:var(--purple);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;
    box-shadow:0 4px 14px rgba(108,99,255,.35);
  }
  .btn-submit:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:1rem;font-size:.82rem;font-weight:700;text-align:center;min-height:1.1em}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}
  .forgot{display:block;text-align:center;margin-top:.9rem;font-size:.78rem;color:var(--purple);font-weight:700;cursor:pointer}
  .hint{font-size:.72rem;color:var(--muted);margin-top:.3rem;line-height:1.5}
  form.hidden{display:none}
</style>
</head>
<body>

<div class="card">
  <div class="logo">🎮 EduQuiz IC3</div>
  <div class="sub">Đăng nhập để tiếp tục</div>

  <div class="tabs">
    <div class="tab active" data-tab="login">Đăng nhập</div>
    <div class="tab" data-tab="register">Đăng ký</div>
  </div>

  <form id="loginForm">
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" required autocomplete="username">
    <label for="loginPass">Mật khẩu</label>
    <input type="password" id="loginPass" required autocomplete="current-password">
    <button type="submit" class="btn-submit" id="loginBtn">Đăng nhập</button>
    <span class="forgot" id="forgotLink">Quên mật khẩu?</span>
  </form>

  <form id="registerForm" class="hidden">
    <label for="regName">Họ và tên</label>
    <input type="text" id="regName" required autocomplete="name">
    <label for="regEmail">Email</label>
    <input type="email" id="regEmail" required autocomplete="username">
    <label for="regPass">Mật khẩu (tối thiểu 6 ký tự)</label>
    <input type="password" id="regPass" required minlength="6" autocomplete="new-password">
    <label>Bạn là?</label>
    <div class="role-choice">
      <div class="role-opt active" data-role="student">🎓 Học sinh</div>
      <div class="role-opt" data-role="teacher">🧑‍🏫 Giáo viên</div>
    </div>
    <div class="hint" id="roleHint">Tài khoản học sinh dùng được ngay sau khi đăng ký.</div>
    <button type="submit" class="btn-submit" id="registerBtn">Tạo tài khoản</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const nextUrl = params.get('next') || 'ic3-dashboard.html';

  if (params.get('reason') === 'idle') {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = '⏳ Bạn đã bị đăng xuất do không hoạt động trong 10 phút. Vui lòng đăng nhập lại.';
    msgEl.classList.add('err');
  }

  // Nếu đã đăng nhập sẵn → chuyển thẳng đi, khỏi cần đăng nhập lại
  EduFirebase.auth.onAuthStateChanged((user) => {
    if (user) redirectByRole();
  });

  async function redirectByRole() {
    try {
      const user = EduFirebase.auth.currentUser;
      const profile = await EduAuth.fetchProfile(user.uid);
      if (!profile) return; // hồ sơ chưa kịp tạo (vừa đăng ký) — để luồng register tự điều hướng
      if (profile.role === 'student') {
        window.location.href = 'index.html';
      } else {
        window.location.href = nextUrl;
      }
    } catch (e) { /* ignore, ở lại trang login */ }
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isLogin = tab.dataset.tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      setMsg('');
    });
  });

  // Role choice
  let chosenRole = 'student';
  document.querySelectorAll('.role-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.role-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      chosenRole = opt.dataset.role;
      document.getElementById('roleHint').textContent = chosenRole === 'teacher'
        ? 'Tài khoản giáo viên cần quản trị viên duyệt trước khi dùng được các trang quản trị.'
        : 'Tài khoản học sinh dùng được ngay sau khi đăng ký.';
    });
  });

  function setMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function friendlyError(err) {
    const code = err && err.code || '';
    const map = {
      'auth/invalid-email': 'Email không hợp lệ.',
      'auth/user-not-found': 'Không tìm thấy tài khoản với email này.',
      'auth/wrong-password': 'Sai mật khẩu.',
      'auth/invalid-credential': 'Email hoặc mật khẩu không đúng.',
      'auth/email-already-in-use': 'Email này đã được đăng ký.',
      'auth/weak-password': 'Mật khẩu quá yếu (tối thiểu 6 ký tự).',
      'auth/too-many-requests': 'Bạn thử sai quá nhiều lần, hãy đợi một lát rồi thử lại.',
    };
    return map[code] || (err && err.message) || 'Đã có lỗi xảy ra, thử lại nhé.';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    setMsg('Đang đăng nhập...', '');
    try {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      await EduAuth.loginUser(email, pass);
      setMsg('✅ Đăng nhập thành công, đang chuyển hướng...', 'ok');
      await redirectByRole();
    } catch (err) {
      setMsg('❌ ' + friendlyError(err), 'err');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    setMsg('Đang tạo tài khoản...', '');
    try {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value;
      const { role, approved } = await EduAuth.registerUser({
        name, email, password: pass, wantsTeacher: chosenRole === 'teacher',
      });
      if (role === 'teacher' && !approved) {
        setMsg('✅ Đã tạo tài khoản giáo viên. Vui lòng chờ quản trị viên duyệt trước khi đăng nhập vào trang quản trị.', 'ok');
        btn.disabled = false;
        return;
      }
      setMsg('✅ Tạo tài khoản thành công, đang chuyển hướng...', 'ok');
      window.location.href = role === 'student' ? 'index.html' : nextUrl;
    } catch (err) {
      setMsg('❌ ' + friendlyError(err), 'err');
      btn.disabled = false;
    }
  });

  document.getElementById('forgotLink').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) { setMsg('Nhập email ở trên trước rồi bấm "Quên mật khẩu?" nhé.', 'err'); return; }
    try {
      await EduAuth.sendResetEmail(email);
      setMsg('📩 Đã gửi email đặt lại mật khẩu tới ' + email, 'ok');
    } catch (err) {
      setMsg('❌ ' + friendlyError(err), 'err');
    }
  });
</script>
</body>
</html>
