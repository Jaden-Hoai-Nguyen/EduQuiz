<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 Quản lý tài khoản — EduQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/admin-users.css">
</head>
<body>

<div class="topbar">
  <a href="ic3-dashboard.html" class="btn btn-ghost">← Dashboard</a>
  <h1>👑 Quản lý tài khoản</h1>
  <div class="spacer"></div>
  <span class="whoami" id="whoami"></span>
  <button type="button" class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
</div>

<div class="wrap">
  <div class="banner">
    Chỉ <b>Quản trị viên</b> mới thấy trang này. Tại đây bạn có thể duyệt giáo viên mới đăng ký,
    và đổi vai trò (Học sinh / Giáo viên / Quản trị viên) của bất kỳ tài khoản nào.
  </div>
  <div class="table-scroll">
    <table>
      <thead><tr><th>Tên</th><th>Email</th><th>Vai trò hiện tại</th><th>Đổi vai trò</th><th>Trạng thái</th></tr></thead>
      <tbody id="userRows"><tr><td colspan="5">Đang tải...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/idle-logout.js"></script>
<script src="js/admin-users.js"></script>
</body>
</html>
